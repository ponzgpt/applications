# One nginx serves every application site; each company gets its own host.
map $sent_http_content_type $cache { default "no-cache"; ~image/ "public, max-age=604800"; application/pdf "public, max-age=86400"; }

server {
  listen 80 default_server;
  server_name _;
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location / { return 404; }
}

# Nous Research: priority application
server {
  listen 80;
  server_name nousresearch.technoir.cloud;
  root /srv/nousresearch;
  include /etc/nginx/snippets/site.conf;
}

# Old address from the first version of the Nous application
server {
  listen 80;
  server_name nouscandidate.technoir.cloud;
  return 301 https://nousresearch.technoir.cloud$request_uri;
}

# 37signals
server {
  listen 80;
  server_name 37signals.technoir.cloud;
  root /srv/37signals;
  include /etc/nginx/snippets/site.conf;
}
