# This site alone. One service per site, so a deploy here cannot ship another company's page.
map $sent_http_content_type $cache { default "no-cache"; ~image/ "public, max-age=604800"; application/pdf "public, max-age=86400"; }

server {
  listen 80 default_server;
  server_name _;
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location / { return 404; }
}

server {
  listen 80;
  server_name omarchy.technoir.cloud;
  root /srv/site;
  include /etc/nginx/snippets/site.conf;
}

# The application's first address, from before it was addressed by way of Omarchy
server {
  listen 80;
  server_name 37signals.technoir.cloud;
  return 301 https://omarchy.technoir.cloud$request_uri;
}
